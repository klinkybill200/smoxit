name: iOS Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || \
          sudo xcode-select -s $(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Setup iOS project
        run: |
          npm install @capacitor/ios
          npx cap add ios
          npx cap sync ios

          python3 <<'PY'
          from pathlib import Path
          path = Path('ios/App/App/AppDelegate.swift')
          text = path.read_text()
          marker = 'capacitorDidRegisterForRemoteNotifications'
          bridge = '''

              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
          if marker not in text:
              idx = text.rfind('\n}')
              if idx == -1:
                  raise SystemExit('Could not patch AppDelegate.swift')
              text = text[:idx] + bridge + text[idx:]
              path.write_text(text)
          PY

          # Build Nummer setzen
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/App/App/Info.plist

          # Push Notifications Capability
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" ios/App/App/Info.plist 2>/dev/null || true

          # Entitlements
          cat > ios/App/App/App.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

          # App Icon
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp assets/AppIcon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cat > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Patch project.pbxproj — Manual signing for App target only
        run: |
          # patch_pbxproj.py liegt im Repo-Root (scripts/patch_pbxproj.py)
          python3 scripts/patch_pbxproj.py ${{ secrets.TEAM_ID }}

      - name: Import Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: smoxit123
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Import Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/smoxit.mobileprovision

      - name: Resolve packages & create RevenueCat entitlements placeholder
        run: |
          cd ios/App

          xcodebuild \
            -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App || true

          # Leere Entitlements im RevenueCat SPM Checkout anlegen
          # (Xcode 26 Bug: RevenueCat_RevenueCat erbt CODE_SIGN_ENTITLEMENTS)
          DERIVED=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 1 -name "App-*" 2>/dev/null | head -1)
          if [ -n "$DERIVED" ]; then
            TARGET="$DERIVED/SourcePackages/checkouts/purchases-ios-spm/App/App.entitlements"
            mkdir -p "$(dirname "$TARGET")"
            cat > "$TARGET" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          EOF
            echo "Created placeholder at: $TARGET"
          else
            echo "WARNING: DerivedData/App-* not found"
            ls ~/Library/Developer/Xcode/DerivedData/ || true
          fi

      - name: Archive
        run: |
          cd ios/App
          # Kein Signing-Override auf CLI — alles in project.pbxproj gesetzt
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./smoxit.xcarchive \
            archive

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath ./smoxit.xcarchive \
            -exportPath ./smoxit-export \
            -exportOptionsPlist /dev/stdin <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.smoxit.ios</key>
                  <string>smoxit AppStore</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            -f ios/App/smoxit-export/App.ipa \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APP_SPECIFIC_PASSWORD"
 
